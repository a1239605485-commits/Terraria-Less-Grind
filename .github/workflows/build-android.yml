name: Build Terraria Less Grind

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c

      - name: Configure native mod
        run: >-
          cmake -S . -B build/android-arm64 -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_SYSTEM_NAME=Android
          -DCMAKE_ANDROID_NDK="$ANDROID_NDK_ROOT"
          -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a
          -DCMAKE_ANDROID_API=24

      - name: Build native library
        run: cmake --build build/android-arm64 --parallel

      - name: Build official TEF package tool
        run: |
          mkdir -p build/tefpkg
          gcc -O3 -c tools/libs/compressor.c tools/libs/lz4.c tools/libs/lz4hc.c \
            tools/libs/siphash.c tools/libs/tefpkg.c
          mv compressor.o lz4.o lz4hc.o siphash.o tefpkg.o build/tefpkg/
          g++ -std=c++17 -O3 tools/main.cpp tools/tool.cpp build/tefpkg/*.o -o tefpkg_tool

      - name: Assemble install package
        run: |
          mkdir -p package/LessGrind
          cp LessGrind/LessGrind.json LessGrind/Manifest.json package/LessGrind/
          cp build/android-arm64/LessGrind/libLessGrind.android.arm64.so package/LessGrind/
          ./tefpkg_tool build package/LessGrind Terraria-Less-Grind-v1.0.0-AndroidARM64.tefpkg

      - name: Publish install package
        uses: actions/upload-artifact@v4
        with:
          name: Terraria-Less-Grind-v1.0.0-AndroidARM64
          path: Terraria-Less-Grind-v1.0.0-AndroidARM64.tefpkg
