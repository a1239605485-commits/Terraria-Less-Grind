name: Build Terraria Less Grind

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c

      - name: Configure native mod
        run: >-
          cmake -S . -B build/android-arm64 -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_SYSTEM_NAME=Android
          -DCMAKE_ANDROID_NDK="$ANDROID_NDK_ROOT"
          -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a
          -DCMAKE_ANDROID_API=24

      - name: Build native library
        run: cmake --build build/android-arm64 --parallel

      - name: Publish Android ARM64 shared library
        uses: actions/upload-artifact@v4
        with:
          name: LessGrind.android.arm64.so
          path: build/android-arm64/LessGrind/LessGrind.android.arm64.so
          if-no-files-found: error
